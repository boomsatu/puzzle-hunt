version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: puzzle_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: puzzle_hunt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d puzzle_hunt"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── GPU Hosting Mode ──────────────────────────────────────────────────────
  # Uncomment service 'puzzle-hunt' di bawah untuk deploy full Docker
  # (hanya jika ingin backend juga di Docker, bukan bare-metal)
  #
  # puzzle-hunt:
  #   build: .
  #   container_name: puzzle_hunt_gpu
  #   restart: unless-stopped
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   env_file: .env
  #   ports:
  #     - "3001:3001"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   volumes:
  #     - ./bin:/app/bin        # kangaroo binary
  #     - ./target:/app/target  # rust binary

volumes:
  postgres_data:
