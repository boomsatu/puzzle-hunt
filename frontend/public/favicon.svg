<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Flame / Accent Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Cyan Spark Gradient -->
    <linearGradient id="cyanSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Squircle Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Subtle Inner Tech Ring -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#f59e0b" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Kangaroo Jump Arc (Trajectory) -->
  <path d="M 15 44 C 18 20, 46 16, 49 34" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 2.5" opacity="0.65"/>
  <circle cx="15" cy="44" r="2" fill="#38bdf8"/>
  <circle cx="32" cy="19" r="2.2" fill="#f59e0b" filter="url(#goldGlow)"/>
  <circle cx="49" cy="34" r="2.5" fill="#ef4444"/>

  <!-- Hunter Crosshair Target Elements -->
  <line x1="32" y1="9" x2="32" y2="13" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="51" x2="32" y2="55" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="9" y1="32" x2="13" y2="32" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="51" y1="32" x2="55" y2="32" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Stylized Bitcoin "₿" Monogram Emblem with Integrated Keyhole -->
  <g filter="url(#goldGlow)">
    <!-- Top & Bottom Bitcoin Serifs -->
    <line x1="27" y1="14" x2="27" y2="18" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="33" y1="14" x2="33" y2="18" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="27" y1="46" x2="27" y2="50" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="33" y1="46" x2="33" y2="50" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>

    <!-- Main Bitcoin Spine & Lobes -->
    <path d="
      M 23 18
      L 34 18
      C 38.5 18, 41.5 20.5, 41.5 24.5
      C 41.5 27.5, 39.5 29.8, 36.5 30.8
      C 40.5 31.8, 43 34.5, 43 39
      C 43 43.8, 39.2 46, 34 46
      L 23 46
      Z
    " fill="url(#goldGrad)"/>

    <!-- Cutouts inside B (Upper & Lower holes) -->
    <!-- Upper Hole -->
    <path d="
      M 28 23
      L 33.5 23
      C 35.5 23, 36.8 24, 36.8 25.8
      C 36.8 27.5, 35.5 28.5, 33.5 28.5
      L 28 28.5
      Z
    " fill="#090d16"/>

    <!-- Lower Hole (Styled with Keyhole notch) -->
    <path d="
      M 28 33.5
      L 34 33.5
      C 36.2 33.5, 37.8 34.8, 37.8 37
      C 37.8 39.2, 36.2 40.5, 34 40.5
      L 28 40.5
      Z
    " fill="#090d16"/>

    <!-- Inner Golden Core Spark -->
    <circle cx="31" cy="37" r="1.3" fill="#38bdf8"/>
  </g>
</svg>
