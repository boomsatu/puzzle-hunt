<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="45%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Master Gold Gradient -->
    <linearGradient id="masterGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Flame Energy Gradient -->
    <linearGradient id="energyFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#fb923c"/>
      <stop offset="80%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Cyber Cyan Gradient -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow Filter for Gold -->
    <filter id="highGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Squircle Body -->
  <rect x="6" y="6" width="116" height="116" rx="32" fill="url(#logoBgGrad)" filter="url(#dropShadow)"/>
  <rect x="6" y="6" width="116" height="116" rx="32" fill="none" stroke="url(#shieldBorder)" stroke-width="2.5"/>

  <!-- Inner Cyber Grid & Radar Rings -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#f59e0b" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="42" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="64" cy="64" r="30" fill="none" stroke="#f59e0b" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Tactical Hunter Crosshair Marks -->
  <line x1="64" y1="14" x2="64" y2="22" stroke="url(#masterGold)" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="106" x2="64" y2="114" stroke="url(#masterGold)" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="64" x2="22" y2="64" stroke="url(#masterGold)" stroke-width="2" stroke-linecap="round"/>
  <line x1="106" y1="64" x2="114" y2="64" stroke="url(#masterGold)" stroke-width="2" stroke-linecap="round"/>

  <!-- Pollard's Kangaroo Jump Trajectory Arcs -->
  <!-- Primary Jump Arc -->
  <path d="M 28 88 C 34 38, 92 32, 98 70" fill="none" stroke="url(#cyberCyan)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 4" opacity="0.75"/>
  
  <!-- Secondary Jump Arc -->
  <path d="M 32 80 C 44 48, 80 44, 94 65" fill="none" stroke="url(#energyFlame)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Kangaroo Jump Checkpoint Nodes -->
  <circle cx="28" cy="88" r="3.5" fill="#38bdf8" filter="url(#highGlow)"/>
  <circle cx="64" cy="38" r="4" fill="#fbbf24" filter="url(#highGlow)"/>
  <circle cx="98" cy="70" r="4.5" fill="#ef4444" filter="url(#highGlow)"/>

  <!-- Central Bitcoin "₿" Monogram Emblem -->
  <g filter="url(#highGlow)">
    <!-- Top Double Serifs -->
    <line x1="53" y1="26" x2="53" y2="34" stroke="url(#masterGold)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="67" y1="26" x2="67" y2="34" stroke="url(#masterGold)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Bottom Double Serifs -->
    <line x1="53" y1="94" x2="53" y2="102" stroke="url(#masterGold)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="67" y1="94" x2="67" y2="102" stroke="url(#masterGold)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Bitcoin Body Structure -->
    <path d="
      M 45 34
      L 68 34
      C 77 34, 83.5 39, 83.5 47
      C 83.5 53.5, 79 57.5, 73.5 59.5
      C 81 61.5, 86.5 66.5, 86.5 75.5
      C 86.5 85, 78.5 94, 67.5 94
      L 45 94
      Z
    " fill="url(#masterGold)"/>

    <!-- Upper Inner Cutout -->
    <path d="
      M 55 44
      L 67 44
      C 71 44, 73.5 46, 73.5 49.5
      C 73.5 53, 71 55, 67 55
      L 55 55
      Z
    " fill="#090d16"/>

    <!-- Lower Inner Cutout (Cryptographic Keyhole Shape) -->
    <path d="
      M 55 65
      L 67.5 65
      C 72 65, 75.5 67.5, 75.5 72.5
      C 75.5 77.5, 72 80, 67.5 80
      L 55 80
      Z
    " fill="#090d16"/>

    <!-- Keyhole Center Spark -->
    <circle cx="61" cy="72.5" r="2.2" fill="#38bdf8"/>
  </g>

  <!-- Small Angular Tech Brackets on Corners -->
  <path d="M 16 28 L 16 16 L 28 16" fill="none" stroke="#f59e0b" stroke-width="1.8" opacity="0.4"/>
  <path d="M 112 28 L 112 16 L 100 16" fill="none" stroke="#f59e0b" stroke-width="1.8" opacity="0.4"/>
  <path d="M 16 100 L 16 112 L 28 112" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.4"/>
  <path d="M 112 100 L 112 112 L 100 112" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.4"/>
</svg>
