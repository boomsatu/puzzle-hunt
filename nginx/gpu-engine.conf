# ==============================================================================
# NGINX CONFIGURATION FOR BITCOIN PUZZLE HUNTER BACKEND & WEBSOCKET
# Domain : gpu-engine-one.bariscode.my.id
# Target : http://127.0.0.1:3001 (Rust Axum Engine)
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. HTTP Server (Port 80)
# Jika menggunakan Cloudflare Proxy (Awan Oranye) dengan mode SSL "Flexible",
# trafik HTTPS dari browser akan diteruskan Cloudflare ke Port 80 di server ini.
server {
    listen 80;
    listen [::]:80;
    server_name gpu-engine-one.bariscode.my.id;

    # Client body size limit
    client_max_body_size 50M;

    # Logging
    access_log /var/log/nginx/gpu_engine_access.log;
    error_log /var/log/nginx/gpu_engine_error.log;

    # WebSocket & REST API Reverse Proxy
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # Header WebSocket Upgrade (Wajib untuk WSS Live Stream Hunter)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout 24 jam agar koneksi WebSocket tidak terputus di tengah jalan
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;

        # Buffering dimatikan agar latency telemetry real-time
        proxy_buffering off;
    }
}

